# Force GitHub workflow registration
name: Docker Login Test

on:
  workflow_dispatch:

jobs:
  test-docker-login:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Validate Docker secrets
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "❌ Error: DOCKER_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "❌ Error: DOCKER_PASSWORD secret is not set"
            exit 1
          fi
          echo "✅ Docker secrets are properly configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Success message
        run: |
          echo "🎉 Logged in successfully to Docker Hub!"

      - name: Verify Docker login
        run: |
          echo "🔍 Verifying Docker login..."
          docker info
          echo "✅ Docker login verification completed successfully!"
